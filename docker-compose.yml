services:
  mysql:
    image: mysql:8.0
    container_name: pricing_mysql
    environment:
      MYSQL_ROOT_PASSWORD: pricing_root_password
      MYSQL_DATABASE: pricing_db
      MYSQL_USER: pricing_user
      MYSQL_PASSWORD: pricing_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pricing_user", "-ppricing_password"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pricing_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: pricing_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricing_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://pricing_user:pricing_password@mysql:3306/pricing_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_URL=http://chroma:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricing_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://pricing_user:pricing_password@mysql:3306/pricing_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_URL=http://chroma:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pricing_celery_beat
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://pricing_user:pricing_password@mysql:3306/pricing_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricing_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/pricing-feed
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - fastapi

volumes:
  mysql_data:
  chroma_data:
